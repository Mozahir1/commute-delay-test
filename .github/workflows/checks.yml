name: Delay checks

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; runs are often late or skipped
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python cloud_check.py
      - run: python report.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.jsonl REPORT.md
          git commit -m "Update results" || exit 0
          git pull --rebase
          git push
