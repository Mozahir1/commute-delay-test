name: Commute alerts

# One run checks the events for about 5.5 hours (looking every 30 seconds), then starts the next run.
# The hourly schedule is only a backup that restarts the chain if a run ever fails to start the next
# one; extra runs wait their turn and never overlap.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read  # read events.json
  actions: write  # start the next run

concurrency:
  group: checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check events for 5.5 hours
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py --minutes 330
      - name: Start the next run
        if: success() || failure()  # not when cancelled, so cancelling a run stops the chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run checks.yml --ref main -R ${{ github.repository }}
